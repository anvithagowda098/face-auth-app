apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.edgefacesentinel.faceprocessor'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Wires in expo-modules-core (provides the Module/ModuleDefinition API).
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.edgefacesentinel.faceprocessor"
  compileSdk safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
  lintOptions { abortOnError false }
}

dependencies {
  // VisionCamera frame-processor classes (com.mrousavy.camera.frameprocessors.*).
  // The project name matches the autolinked Gradle module; if your prebuild names
  // it differently, run `./gradlew :modules:projects` or check settings.gradle.
  implementation project(":react-native-vision-camera")
  implementation "com.google.mlkit:face-detection:16.1.6"
}
